<div class="sc-admin-shell" [class.sc-sidebar-collapsed]="!sidebarOpen()">
  <aside class="sc-admin-sidebar">
    <div class="sc-admin-brand">
      <span class="text-white fw-bold">Shivkrupa</span> <span class="sc-gold-text">Admin</span>
    </div>

    <nav class="nav flex-column sc-admin-nav">
      <a class="nav-link" routerLink="/admin/dashboard" routerLinkActive="active">
        <i class="bi bi-speedometer2 me-2"></i>Dashboard
      </a>
      <a class="nav-link" routerLink="/admin/products" routerLinkActive="active">
        <i class="bi bi-box-seam me-2"></i>Products
      </a>
      <a class="nav-link" routerLink="/admin/categories" routerLinkActive="active">
        <i class="bi bi-tags me-2"></i>Categories
      </a>
      <a class="nav-link" routerLink="/admin/brands" routerLinkActive="active">
        <i class="bi bi-bookmark-star me-2"></i>Brands
      </a>
      <a class="nav-link" routerLink="/admin/customers" routerLinkActive="active">
        <i class="bi bi-people me-2"></i>Customers
      </a>
      <a class="nav-link" routerLink="/admin/messages" routerLinkActive="active">
        <span class="icon">✉</span> Inquiries
      </a>
    </nav>

    <div class="sc-admin-sidebar-footer">
      <a class="nav-link" routerLink="/"><i class="bi bi-box-arrow-left me-2"></i>Back to Store</a>
      <button class="nav-link btn btn-link text-start p-0" type="button" (click)="onLogout()">
        <i class="bi bi-box-arrow-right me-2"></i>Logout
      </button>
    </div>
  </aside>

  <div class="sc-admin-main">
    <header class="sc-admin-topbar">
      <button class="btn btn-sm btn-outline-secondary" type="button" (click)="toggleSidebar()">
        <i class="bi bi-list"></i>
      </button>
      <span class="ms-3 fw-semibold">Welcome, {{ auth.currentUser()?.fullName }}</span>
    </header>

    <main class="sc-admin-content sc-fade-in">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<sc-toast-container></sc-toast-container>
