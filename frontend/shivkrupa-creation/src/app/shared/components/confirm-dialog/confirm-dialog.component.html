<div class="overlay" *ngIf="open" (click)="cancelled.emit()">
  <div class="dialog" (click)="$event.stopPropagation()">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="actions">
      <button class="btn btn-outline btn-sm" (click)="cancelled.emit()">Cancel</button>
      <button class="btn btn-sm" [class.btn-danger]="danger" [class.btn-primary]="!danger" (click)="confirmed.emit()">
        {{ confirmLabel }}
      </button>
    </div>
  </div>
</div>
