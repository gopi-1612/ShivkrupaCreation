<div class="container sc-section">
  <h2 class="mb-4">My Profile</h2>

  @if (loading()) {
    <sc-loading-spinner message="Loading your profile…"></sc-loading-spinner>
  } @else {
    <div class="row g-4">
      <div class="col-lg-7">
        <div class="card p-4">
          <h5 class="mb-3">Profile Details</h5>
          <form [formGroup]="profileForm" (ngSubmit)="saveProfile()" novalidate>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-control" formControlName="fullName" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <input type="tel" class="form-control" formControlName="phoneNumber" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Business Name</label>
                <input type="text" class="form-control" formControlName="businessName" />
              </div>
              <div class="col-md-6">
                <label class="form-label">GST Number</label>
                <input type="text" class="form-control" formControlName="gstNumber" />
              </div>
              <div class="col-12">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" formControlName="address" />
              </div>
              <div class="col-md-4">
                <label class="form-label">City</label>
                <input type="text" class="form-control" formControlName="city" />
              </div>
              <div class="col-md-4">
                <label class="form-label">State</label>
                <input type="text" class="form-control" formControlName="state" />
              </div>
              <div class="col-md-4">
                <label class="form-label">PIN Code</label>
                <input type="text" class="form-control" formControlName="pinCode" />
              </div>
            </div>

            <button type="submit" class="btn btn-primary mt-4" [disabled]="savingProfile()">
              @if (savingProfile()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              Save Changes
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-5">
        <div class="card p-4">
          <h5 class="mb-3">Change Password</h5>
          <form [formGroup]="passwordForm" (ngSubmit)="changePassword()" novalidate>
            <div class="mb-3">
              <label class="form-label">Current Password</label>
              <input type="password" class="form-control" formControlName="currentPassword" />
            </div>
            <div class="mb-3">
              <label class="form-label">New Password</label>
              <input type="password" class="form-control" formControlName="newPassword" />
            </div>
            <div class="mb-3">
              <label class="form-label">Confirm New Password</label>
              <input type="password" class="form-control" formControlName="confirmNewPassword" />
            </div>

            <button type="submit" class="btn btn-outline-primary" [disabled]="savingPassword()">
              @if (savingPassword()) {
                <span class="spinner-border spinner-border-sm me-2"></span>
              }
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  }
</div>
